apiVersion: apps/v1
kind: Deployment

metadata:
  name: inventory-management

spec:
  replicas: 1

  revisionHistoryLimit: 10

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      app: inventory-management

  template:
    metadata:
      labels:
        app: inventory-management

    spec:
      containers:
        - name: inventory-management

          image: docker.io/lukasdedd/inventory-app:1.0.0


          ports:
            - containerPort: 8080

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
