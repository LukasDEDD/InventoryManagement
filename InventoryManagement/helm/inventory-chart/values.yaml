
replicaCount: 1


image:
  repository: docker.io/lukasdedd/inventory-app
  pullPolicy: IfNotPresent
  tag: "1.6.0"


imagePullSecrets: []


nameOverride: ""
fullnameOverride: ""


serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""


podAnnotations: {}
podLabels:
  app: inventory-management


podSecurityContext: {}
securityContext: {}


service:
  type: ClusterIP
  port: 8080


ingress:
  enabled: true
  className: ""
  annotations: {}
  hosts:
    - host: inventory.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []


httpRoute:
  enabled: false
  annotations: {}
  parentRefs:
    - name: gateway
      sectionName: http
  hostnames:
    - inventory.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /


resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi


livenessProbe:
  httpGet:
    path: /actuator/health
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 20

readinessProbe:
  httpGet:
    path: /actuator/health
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 10


autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80


volumes: []


volumeMounts: []


nodeSelector: {}
tolerations: []
affinity: {}
