{{- if .Values.postgresql.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels:
    app: postgres

spec:
  replicas: 1

  selector:
    matchLabels:
      app: postgres

  template:
    metadata:
      labels:
        app: postgres

    spec:
      containers:
        - name: postgres

          image: "{{ .Values.postgresql.image.repository }}:{{ .Values.postgresql.image.tag }}"

          ports:
            - containerPort: 5432
              protocol: TCP

          env:
            - name: POSTGRES_DB
              value: "{{ .Values.postgresql.database }}"

            - name: POSTGRES_USER
              value: "{{ .Values.postgresql.username }}"

            - name: POSTGRES_PASSWORD
              value: "{{ .Values.postgresql.password }}"

          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - "{{ .Values.postgresql.username }}"
                - -d
                - "{{ .Values.postgresql.database }}"

            initialDelaySeconds: 5
            periodSeconds: 5

{{- end }}