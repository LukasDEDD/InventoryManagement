
spring.application.name=InventoryManagement
server.port=8080

# PostgreSQL / docker-compose
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/InventoryManagement}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres} #postgres
spring.datasource.password= ${SPRING_DATASOURCE_PASSWORD:} #820414Got


# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always




